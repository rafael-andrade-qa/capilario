name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build no subcaminho do repositório
        run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Valores públicos do cliente (Settings > Secrets and variables > Actions > Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Conferir configuração
        run: |
          test -n "${{ vars.VITE_SUPABASE_URL }}" || { echo "::error::Defina a variável VITE_SUPABASE_URL no repositório"; exit 1; }
          test -n "${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}" || { echo "::error::Defina a variável VITE_SUPABASE_PUBLISHABLE_KEY no repositório"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
